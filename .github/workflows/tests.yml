name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------
      # Setup
      # --------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch

      - name: Create environment
        run: hatch env create

      # --------------------------
      # Quality Checks
      # --------------------------
      - name: Lint
        run: hatch run lint

      - name: Format check (Black)
        run: hatch run format --check

      - name: Type check (Mypy)
        run: hatch run typecheck

      # --------------------------
      # Tests & Coverage
      # --------------------------
      - name: Run tests with coverage
        run: hatch run pytest --cov=invoco --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

      # --------------------------
      # Docs Build
      # --------------------------
      - name: Build docs
        run: hatch run sphinx-build -W docs docs/_build/html
