[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoco"
version = "0.1.0"
description = "A task execution engine for AI-driven tool calls"
authors = [{ name = "Christopher Bailey", email = "beingpythonic@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
keywords = ["ai", "tasks", "scheduler", "tool-calls", "automation"]
dependencies = []

[project.scripts]
invoco = "invoco.cli.main:main"

[project.optional-dependencies]
dev = [
  "ruff",
  "black",
  "mypy",
  "pre-commit",
]
test = [
  "pytest",
  "pytest-cov",
]
docs = [
  "sphinx>=8.0",
  "furo",
  "myst-parser",
  "linkify-it-py",
]

[tool.hatch.build.targets.wheel]
packages = ["invoco"]

# =================================
# Ruff (lint + import/style checks)
# =================================
[tool.ruff]
line-length = 88
target-version = "py39"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN"]
ignore = ["E501"]
exclude = ["docs"]

# ======================
# Mypy (type checking)
# ======================
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# =====================
# Black (formatter)
# =====================
[tool.black]
line-length = 88
target-version = ["py39"]

# ====================
# Pytest (test runner)
# ====================
[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]

# ===================================
# Hatch Environments & Dev Scripts
# ===================================
[tool.hatch.envs.default]
dependencies = [".[dev,test,docs]"]

[tool.hatch.envs.test]
dependencies = [".[test]"]

[tool.hatch.envs.docs]
dependencies = [".[docs]"]

[tool.hatch.envs.dev]
dependencies = [".[dev,test,docs]"]

[tool.hatch.envs.dev.scripts]
test = "pytest"
lint = "ruff check invoco"
format = "black invoco"
typecheck = "mypy invoco"
docs = "sphinx-build docs docs/_build/html"